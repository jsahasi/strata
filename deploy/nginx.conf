# Serves the marketing site. /login is a real page rather than a dead link while the
# application is still being built -- a sign-in button that returns an nginx 404 costs
# more credibility than not having one.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /login { try_files /login.html =404; }

  # RFC 9116 wants this exact path, and reviewers fetch it. The catch-all below
  # would serve the bytes on its own, so this block earns its place on two
  # counts, both measured against nginx rather than assumed:
  #   - The RFC asks for text/plain with the charset parameter set to utf-8.
  #     Under the catch-all nginx sends bare `text/plain`; `charset utf-8` adds
  #     the parameter, and `default_type` covers an image with no mime.types.
  #   - The path starts with a dot. Add the usual `location ~ /\. { deny all; }`
  #     hardening line later and the catch-all answers 403 instead. An exact
  #     match outranks a regex one, so this block goes on serving.
  # Neither guard helps if the deploy step never copies the dotted directory.
  # That shows up as a 404 on the one path a reviewer checks, so fetch it after
  # every deploy rather than trusting this file.
  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
  location / { try_files $uri $uri/ =404; }
}
