# The marketing site, with the application behind it on the same hostname.
#
# HOW THE HOSTNAME IS SHARED. The root path belongs to the marketing site, and
# every path the application owns is proxied to it by name. Both want "/": the
# app serves the project board there and the site serves the landing page. The
# site wins, because a stranger arriving at strata.sudama.ai should meet the
# argument before the product. Nothing is lost -- /projects is the same screen,
# and app/web/views/auth.py sends a person there after signing in for exactly
# this reason.
#
# WHY A NAMED LIST AND NOT A CATCH-ALL. Proxying everything except a handful of
# .html files would mean any path added to the site later silently reaches the
# application, and any path added to the application silently 404s here. Both
# failures are quiet. The list below is the seam, written down, and it is
# checked by fetching each path after a deploy rather than assumed.
#
# It must match the top-level paths in app/main.py. A router added there and not
# here 404s in production while passing every test -- this repository's most
# frequent failure, and the reason tests/test_app_wiring.py derives its
# assertions from app.routes instead of from a list somebody maintains.

# THE EDGE TERMINATES TLS, NOT THIS NGINX. It listens on 80 only, so $scheme is
# always "http" here and forwarding it overwrites the real protocol the browser
# used. The application then sees http, correctly refuses to send HSTS -- a
# browser must ignore HSTS off a plaintext response, so sending it there is a
# claim the transport cannot carry -- and the header never appeared in
# production while every test passed, because in a test nginx is not in the path.
#
# This map keeps whatever the edge already said and falls back to $scheme when
# nothing did, so the file still works if this nginx is ever put in front.
# THE DEFAULT IS https AND THAT IS A STATEMENT ABOUT THIS DEPLOYMENT, NOT A
# GUESS. This file is served only behind the TLS edge in front of
# strata.sudama.ai, which reaches this nginx on port 80 having already
# terminated the certificate. It forwards the real client address -- the access
# log shows 76.126.31.87 behind 10.0.1.2 -- and does NOT forward the protocol,
# so there is nothing here to read it from. If the edge ever starts sending
# X-Forwarded-Proto, that wins.
#
# ANYBODY REUSING THIS FILE WITHOUT A TLS EDGE IN FRONT MUST CHANGE THIS to
# $scheme. Left as https it would tell a browser that a plaintext origin is
# https-only, and HSTS pins for a year.
map $http_x_forwarded_proto $client_proto {
  default https;
  "~^https?$" $http_x_forwarded_proto;
}

upstream strata_app {
  server strata-app:8000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A filing arrives by ingestion, not by form post. Nothing here uploads.
  client_max_body_size 2m;

  # RFC 9116 wants this exact path, and reviewers fetch it. The catch-all below
  # would serve the bytes on its own, so this block earns its place on two
  # counts, both measured against nginx rather than assumed:
  #   - The RFC asks for text/plain with the charset parameter set to utf-8.
  #     Under the catch-all nginx sends bare `text/plain`; `charset utf-8` adds
  #     the parameter, and `default_type` covers an image with no mime.types.
  #   - The path starts with a dot. Add the usual `location ~ /\. { deny all; }`
  #     hardening line later and the catch-all answers 403 instead. An exact
  #     match outranks a regex one, so this block goes on serving.
  # Neither guard helps if the deploy step never copies the dotted directory.
  # That shows up as a 404 on the one path a reviewer checks, so fetch it after
  # every deploy rather than trusting this file.
  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
  }

  # ------------------------------------------------------------- the app ----
  #
  # X-Forwarded-Proto is load-bearing, not decoration. The session cookie is
  # marked Secure and uvicorn runs with --proxy-headers; without this header it
  # believes the request arrived over http, and the cookie is dropped in
  # silence. That presents as "signing in does nothing", with no error anywhere.
  #
  # /s/ is the share link and is meant to work with no session. It carries a
  # bearer token in its path, so it must never be redirected -- a redirect
  # copies the token into a Location header and into the access log, which is
  # the defect app/web/deps.py was just corrected for.
  # THIS LIST IS THE ONE THING HERE THAT FAILS QUIETLY IN BOTH DIRECTIONS. A path
  # the application serves and this list omits is a 404 nobody can debug from the
  # application logs, because the request never arrives. `permissions` was added
  # in the same change that mounted its router in app/main.py -- mounting a
  # screen and forgetting this file gives a route that works on a developer's
  # machine and 404s in production, which is the worst shape a bug can take.
  location ~ ^/(login|logout|projects|proceedings|changes|review|escalations|workflow|admin|permissions|chat|feedback|users|invite|s|static|healthz)(/|$) {
    proxy_pass http://strata_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header Connection        "";

    # A model call can take a while and the assistant streams nothing, so this
    # is generous. It is not unlimited: a hung upstream should surface as an
    # error somebody can report, not as a spinner that never resolves.
    proxy_read_timeout 60s;
  }

  # ------------------------------------------------------------ the site ----
  error_page 404 /404.html;
  location = /404.html { internal; }
  location / { try_files $uri $uri/ =404; }
}
